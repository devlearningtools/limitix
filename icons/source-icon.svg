<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffc879"/>
      <stop offset="100%" stop-color="#f0a94e"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)" stroke="#2e2e2e" stroke-width="2"/>

  <!-- Gauge track (full circle, dim) -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#333333" stroke-width="12"/>

  <!-- Gauge fill (partial arc, ~72% of the ring, representing a live usage meter) -->
  <circle
    cx="64" cy="64" r="38"
    fill="none"
    stroke="url(#ring)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-dasharray="172 239"
    transform="rotate(-90 64 64)"
  />

  <!-- Center dot -->
  <circle cx="64" cy="64" r="9" fill="#f0a94e"/>
</svg>
